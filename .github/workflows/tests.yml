name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -euo pipefail
          version=4.7.2-stable
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${version}/Godot_v${version}_linux.x86_64.zip"
          curl -sSL -o SHA512-SUMS.txt \
            "https://github.com/godotengine/godot/releases/download/${version}/SHA512-SUMS.txt"
          # Rebuild the line as "<hash>  godot.zip" rather than appending to it:
          # appending leaves two filenames on the line and sha512sum then looks
          # for a single file with that whole string as its name.
          grep "Godot_v${version}_linux.x86_64.zip" SHA512-SUMS.txt \
            | awk '{print $1 "  godot.zip"}' \
            | sha512sum -c -
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${version}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --import

      - name: Test suite and scene boots
        # run.sh covers the scenes too. Booting a scene does not fail on a
        # broken script: a parse error still exits 0, so a smoke test that
        # only checks the exit code is not a smoke test.
        run: ./tests/run.sh
